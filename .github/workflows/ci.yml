name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Compile Python
        run: python -m py_compile motion_recorder/recorder.py

      - name: Parse YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for name in ["repository.yaml", "motion_recorder/config.yaml"]:
              with Path(name).open("r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"OK: {name}")
          PY

      - name: Build amd64 app image
        run: |
          docker build \
            --build-arg BUILD_VERSION=0.3.0 \
            --build-arg BUILD_ARCH=amd64 \
            motion_recorder
